services:
  jenkins:
    build: .
    image: souverainrecrut-jenkins
    container_name: jenkins
    restart: unless-stopped
    # root pour accéder au socket Docker de l'hôte (usage local uniquement)
    user: root
    env_file: .env
    environment:
      CASC_JENKINS_CONFIG: /var/jenkins_casc
      JAVA_OPTS: >-
        -Djenkins.install.runSetupWizard=false
        -Dhudson.plugins.git.GitSCM.ALLOW_LOCAL_CHECKOUT=true
    ports:
      - "8080:8080"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
      - ./casc:/var/jenkins_casc:ro
      # Dépôt local, cloné par le job : seuls les commits sont vus, pas les fichiers modifiés
      - ..:/home/projet:ro

volumes:
  jenkins_home:
    name: jenkins_home
