services:
  jenkins:
    build: .
    image: souverainrecrut-jenkins
    container_name: jenkins
    restart: unless-stopped
    # root pour accéder au socket Docker de l'hôte (usage local uniquement)
    user: root
    env_file: .env
    environment:
      CASC_JENKINS_CONFIG: /var/jenkins_casc
      JAVA_OPTS: -Djenkins.install.runSetupWizard=false
    ports:
      - "8080:8080"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
      - ./casc:/var/jenkins_casc:ro

volumes:
  jenkins_home:
    name: jenkins_home
