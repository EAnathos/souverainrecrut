# ==========================================
# SonarQube Cloud - SouverainRecrut Backend
# ==========================================
# Le token n'est jamais versionné : il est fourni par la variable
# d'environnement SONAR_TOKEN (credential Jenkins).

sonar.host.url=https://sonarcloud.io
sonar.organization=eanathos
sonar.projectKey=EAnathos_souverainrecrut
sonar.projectName=SouverainRecrut Backend

sonar.sourceEncoding=UTF-8

# Code source et tests
sonar.sources=src
sonar.tests=tests
sonar.exclusions=src/**/README.md

# Couverture produite par "npm run test:coverage"
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.coverage.exclusions=src/server.ts,src/docs/**,src/types/**

# Code de documentation Swagger : pas de détection de duplication
sonar.cpd.exclusions=src/docs/**
